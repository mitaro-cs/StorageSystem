name: Выпуск

# Тег v1.2.3 → выпуск на GitHub: установщики приложения хоста (macOS, Windows) и groupbase.jar
# для своего сервера. Вручную (workflow_dispatch) — те же файлы, но только как артефакты сборки.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: 21

jobs:
  jar:
    name: Сервер (jar)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Версия из тега
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: ./mvnw -B -q versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false
      - run: ./mvnw -B -DskipTests package
      - uses: actions/upload-artifact@v5
        with:
          name: groupbase-jar
          path: target/groupbase.jar
          retention-days: 7

  desktop:
    name: Приложение — ${{ matrix.name }}
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        # app — не лишнее: архив автообновления (.app.tar.gz) tauri делает только из цели app, не из dmg.
        # macOS — на macos-26: значок AppIcon.icon (светлый и тёмный Dock) собирает только Xcode 26+.
        include:
          - name: macOS (Apple Silicon)
            os: macos-26
            target: aarch64-apple-darwin
            bundles: app,dmg
            file: macos-apple-silicon.dmg
          - name: macOS (Intel)
            os: macos-26
            target: x86_64-apple-darwin
            bundles: app,dmg
            file: macos-intel.dmg
            # Java для Intel собирается на Apple Silicon из модулей x64-сборки того же JDK.
            cross-jdk: mac/x64
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            file: windows-setup.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: groupbase-jar
          path: target
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: JDK целевой системы (для jlink)
        if: matrix.cross-jdk
        run: |
          # jlink и модули целевой системы должны быть одной версии — берём ровно ту, что установлена.
          ver=$(sed -n 's/^JAVA_RUNTIME_VERSION="\([^"]*\)"/\1/p' "$JAVA_HOME/release" | sed 's/-LTS$//')
          release=$(printf 'jdk-%s' "$ver" | sed 's/+/%2B/')
          mkdir -p "$RUNNER_TEMP/target-jdk"
          curl -fsSL "https://api.adoptium.net/v3/binary/version/$release/${{ matrix.cross-jdk }}/jdk/hotspot/normal/eclipse" \
            | tar -xz -C "$RUNNER_TEMP/target-jdk" --strip-components=1
          echo "JMODS=$RUNNER_TEMP/target-jdk/Contents/Home/jmods" >> "$GITHUB_ENV"
      - name: Java и сервер в ресурсы приложения
        run: scripts/desktop-resources.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
        working-directory: desktop
      - name: Сборка установщика
        working-directory: desktop
        # Подпись файлов обновления: приложение ставит только то, что подписано этим ключом.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} \
            --config "{\"version\":\"${{ needs.jar.outputs.version }}\"}"
      # Без Assets.car macOS 26+ берёт старый значок .icns и в тёмном Dock логотип теряется.
      - name: Значок macOS 26+ в приложении
        if: runner.os == 'macOS'
        run: |
          app=$(find "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          [ -s "$app/Contents/Resources/Assets.car" ] || { echo "Нет Assets.car: AppIcon.icon не собран (нужен Xcode 26+)" >&2; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Contents/Info.plist"
      - name: Предпросмотр значка в разных оформлениях Dock
        if: runner.os == 'macOS' && !matrix.cross-jdk
        continue-on-error: true
        run: |
          ictool="$(dirname "$(xcode-select -p)")/Applications/Icon Composer.app/Contents/Executables/ictool"
          mkdir -p icon-preview
          for r in Default Dark ClearDark TintedDark; do
            "$ictool" desktop/src-tauri/icons/AppIcon.icon --export-image --output-file "icon-preview/$r.png" \
              --platform macOS --rendition "$r" --width 256 --height 256 --scale 2
          done
      - uses: actions/upload-artifact@v5
        if: runner.os == 'macOS' && !matrix.cross-jdk
        continue-on-error: true
        with:
          name: macos-icon-preview
          path: icon-preview
          retention-days: 7
      # Собранное приложение должно запуститься (сборку для Intel на Apple Silicon не запустить).
      - name: Проверка запуска
        if: ${{ !matrix.cross-jdk }}
        run: scripts/desktop-smoke.sh desktop/src-tauri/target/${{ matrix.target }}/release/groupbase-desktop
      - name: Имя файла для выпуска
        run: |
          dir="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          # Без ls с несуществующим каталогом и без пайпа: в GitHub bash включён pipefail.
          src=$(find "$dir" -maxdepth 2 -type f \( -name '*.dmg' -o -name '*-setup.exe' \) -print -quit)
          [ -n "$src" ] || { echo "Установщик не найден в $dir" >&2; exit 1; }
          name="groupbase-${{ needs.jar.outputs.version }}-${{ matrix.file }}"
          mkdir -p dist
          cp "$src" "dist/$name"
          # Для автообновления: подпись установщика Windows, архив приложения macOS с подписью.
          if [ -f "$src.sig" ]; then cp "$src.sig" "dist/$name.sig"; fi
          app=$(find "$dir" -maxdepth 2 -type f -name '*.app.tar.gz' -print -quit)
          if [ -n "$app" ]; then
            cp "$app" "dist/${name%.dmg}.app.tar.gz"
            cp "$app.sig" "dist/${name%.dmg}.app.tar.gz.sig"
          fi
          ls -la dist
      - uses: actions/upload-artifact@v5
        with:
          name: groupbase-${{ matrix.file }}
          path: dist/*
          retention-days: 14

  publish:
    name: Выпуск на GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [jar, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          # Только файлы выпуска (groupbase-*), без предпросмотра значка.
          pattern: groupbase-*
          merge-multiple: true
      - run: ls -la dist
      - name: Файл обновлений latest.json
        run: |
          v="${{ needs.jar.outputs.version }}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          # Без файла или подписи обновление на этой системе сломается — такой выпуск не публикуем.
          for f in macos-apple-silicon.app.tar.gz macos-intel.app.tar.gz windows-setup.exe; do
            if [ ! -s "dist/groupbase-$v-$f" ] || [ ! -s "dist/groupbase-$v-$f.sig" ]; then
              echo "Нет файла обновления или его подписи: groupbase-$v-$f" >&2
              exit 1
            fi
          done
          sig() { cat "dist/groupbase-$v-$1.sig"; }
          notes=$(awk -v h="## $v" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md 2>/dev/null)
          jq -n --arg v "$v" --arg notes "$notes" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg a "$base/groupbase-$v-macos-apple-silicon.app.tar.gz" \
            --arg as "$(sig macos-apple-silicon.app.tar.gz)" \
            --arg i "$base/groupbase-$v-macos-intel.app.tar.gz" \
            --arg is "$(sig macos-intel.app.tar.gz)" \
            --arg w "$base/groupbase-$v-windows-setup.exe" \
            --arg ws "$(sig windows-setup.exe)" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
              "darwin-aarch64": {signature: $as, url: $a},
              "darwin-x86_64": {signature: $is, url: $i},
              "windows-x86_64": {signature: $ws, url: $w}}}' > dist/latest.json
          rm dist/*.sig
          cat dist/latest.json | head -c 400
      - name: Выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.jar.outputs.version }}"
          notes=$(awk -v h="## $v" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md 2>/dev/null)
          [ -n "$notes" ] || notes="Скачайте установщик для своего компьютера — инструкция в README."
          gh release create "$GITHUB_REF_NAME" dist/* --title "groupbase $v" --notes "$notes" \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
