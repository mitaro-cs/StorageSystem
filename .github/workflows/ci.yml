name: CI

on:
  push:
    branches: [miaro, groupbase]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Фронтенд
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit -- --run
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Размер JS-бандла (gzip) не больше 100 КБ
        run: node scripts/bundle-size.mjs 102400
      - uses: actions/upload-artifact@v5
        with:
          name: web-build
          path: web/build
          retention-days: 1

  java:
    name: Бэкенд
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/download-artifact@v5
        with:
          name: web-build
          path: web/build
      - run: ./mvnw -B spotless:check
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v5
        with:
          name: groupbase-jar
          path: target/groupbase.jar
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    needs: java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v5
        with:
          name: groupbase-jar
          path: target
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  desktop:
    name: Приложение для компьютера (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # Настоящие Java и jar кладутся только при выпуске; для проверки кода хватит заглушек.
      - name: Заглушки ресурсов
        run: mkdir -p resources/runtime/bin && touch resources/runtime/bin/java resources/groupbase.jar
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings

  desktop-run:
    name: Приложение для компьютера — запуск (${{ matrix.os }})
    needs: java
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: groupbase-jar
          path: target
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: scripts/desktop-resources.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: cargo build --locked
        working-directory: desktop/src-tauri
      - run: cargo test --locked
        working-directory: desktop/src-tauri
      - name: Запуск приложения
        run: scripts/desktop-smoke.sh desktop/src-tauri/target/debug/groupbase-desktop

  vulns:
    name: Уязвимости зависимостей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: google/osv-scanner-action/osv-scanner-action@v2.2.3
        with:
          scan-args: |-
            --lockfile=web/package-lock.json
            --lockfile=pom.xml
