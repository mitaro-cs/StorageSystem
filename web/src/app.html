<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="robots" content="noindex, nofollow" />
		<meta name="referrer" content="no-referrer" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f1f2f4" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-180.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/inter-cyrillic-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<script>
			try {
				var t = localStorage.getItem('gb-theme');
				if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
		</script>
		<title>groupbase</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Заставка, пока грузится приложение: плитка логотипа появляется, слои складываются в стопку
		     и «дышат», по плитке пробегает блик, от неё расходятся круги. Убирает её корневой макет
		     (routes/+layout.svelte), когда интерфейс готов. -->
		<div id="splash" aria-hidden="true">
			<style>
				#splash {
					--sp-bg: #f1f2f4;
					--sp-fg: #0d0d0f;
					--sp-glow: 0.12;
					position: fixed;
					inset: 0;
					z-index: 9999;
					display: grid;
					place-items: center;
					background: var(--sp-bg);
					color: var(--sp-fg);
					transition:
						opacity 380ms ease,
						visibility 0s 380ms;
				}
				:root[data-theme='dark'] #splash {
					--sp-bg: #000;
					--sp-fg: #f5f5f7;
					--sp-glow: 0.22;
				}
				@media (prefers-color-scheme: dark) {
					:root:not([data-theme='light']) #splash {
						--sp-bg: #000;
						--sp-fg: #f5f5f7;
						--sp-glow: 0.22;
					}
				}
				#splash.gone {
					opacity: 0;
					visibility: hidden;
					pointer-events: none;
				}
				#splash .sp {
					display: flex;
					flex-direction: column;
					align-items: center;
					gap: 10px;
					transition: transform 380ms cubic-bezier(0.2, 0.8, 0.2, 1);
				}
				#splash.gone .sp {
					transform: scale(1.08);
				}
				#splash svg {
					width: 132px;
					height: 132px;
					overflow: visible;
				}
				#splash .t {
					transform-box: fill-box;
					transform-origin: center;
					animation:
						sp-pop 760ms cubic-bezier(0.2, 0.9, 0.25, 1.3) both,
						sp-bob 3.2s ease-in-out 1.2s infinite;
				}
				#splash .bg {
					fill: currentColor;
				}
				#splash .l {
					fill: none;
					stroke: var(--sp-bg);
					stroke-width: 2.2;
					stroke-linecap: round;
					stroke-linejoin: round;
					transform-box: view-box;
				}
				#splash .l1 {
					--lift: -1.6px;
					animation:
						sp-drop 640ms cubic-bezier(0.3, 1.5, 0.5, 1) 380ms both,
						sp-float 2.4s ease-in-out 1.3s infinite;
				}
				#splash .l2 {
					--lift: -1px;
					animation:
						sp-drop 640ms cubic-bezier(0.3, 1.5, 0.5, 1) 500ms both,
						sp-float 2.4s ease-in-out 1.45s infinite;
				}
				#splash .l3 {
					--lift: -0.5px;
					animation:
						sp-drop 640ms cubic-bezier(0.3, 1.5, 0.5, 1) 620ms both,
						sp-float 2.4s ease-in-out 1.6s infinite;
				}
				#splash .shine {
					fill: url(#sp-shine);
					animation: sp-shine 3s cubic-bezier(0.4, 0, 0.2, 1) 1.1s infinite;
				}
				#splash .ring {
					fill: none;
					stroke: currentColor;
					stroke-width: 0.6;
					opacity: 0;
					transform-box: fill-box;
					transform-origin: center;
					animation: sp-ring 2.6s cubic-bezier(0.2, 0.6, 0.3, 1) 900ms infinite;
				}
				#splash .ring2 {
					animation-delay: 2.2s;
				}
				#splash .glow {
					fill: url(#sp-glow);
					opacity: 0;
					transform-box: fill-box;
					transform-origin: center;
					animation: sp-glow 3.2s ease-in-out 700ms infinite;
				}
				#splash .word {
					font:
						650 23px/1 -apple-system,
						'Segoe UI',
						Roboto,
						sans-serif;
					letter-spacing: -0.02em;
					animation: sp-word 760ms cubic-bezier(0.2, 0.8, 0.2, 1) 560ms both;
				}
				#splash .hint {
					min-height: 18px;
					margin-top: 6px;
					font:
						500 13px/1.4 -apple-system,
						'Segoe UI',
						Roboto,
						sans-serif;
					opacity: 0;
					animation: sp-hint 700ms ease 2.8s forwards;
				}
				:root[data-theme='dark'] #splash .shine {
					display: none;
				}
				@media (prefers-color-scheme: dark) {
					:root:not([data-theme='light']) #splash .shine {
						display: none;
					}
				}
				@keyframes sp-pop {
					from {
						opacity: 0;
						transform: scale(0.35) rotate(-18deg);
					}
					55% {
						opacity: 1;
					}
					to {
						transform: none;
					}
				}
				@keyframes sp-bob {
					0%,
					100% {
						transform: translateY(0);
					}
					50% {
						transform: translateY(-1.2px);
					}
				}
				@keyframes sp-drop {
					from {
						opacity: 0;
						transform: translateY(-8px);
					}
					to {
						opacity: 1;
						transform: none;
					}
				}
				@keyframes sp-float {
					0%,
					100% {
						transform: none;
					}
					50% {
						transform: translateY(var(--lift));
					}
				}
				@keyframes sp-shine {
					from {
						transform: translateX(0) skewX(-20deg);
					}
					45%,
					to {
						transform: translateX(58px) skewX(-20deg);
					}
				}
				@keyframes sp-ring {
					from {
						opacity: 0.32;
						transform: scale(1);
					}
					to {
						opacity: 0;
						transform: scale(1.7);
					}
				}
				@keyframes sp-word {
					from {
						opacity: 0;
						letter-spacing: 0.32em;
						filter: blur(6px);
					}
					to {
						opacity: 1;
						letter-spacing: -0.02em;
						filter: none;
					}
				}
				@keyframes sp-glow {
					0%,
					100% {
						opacity: calc(var(--sp-glow) * 0.45);
						transform: scale(0.9);
					}
					50% {
						opacity: var(--sp-glow);
						transform: scale(1.05);
					}
				}
				@keyframes sp-hint {
					to {
						opacity: 0.5;
					}
				}
				@media (prefers-reduced-motion: reduce) {
					#splash *,
					#splash .sp {
						animation: none !important;
						transition: none !important;
					}
					#splash .ring,
					#splash .glow,
					#splash .shine,
					#splash .hint {
						display: none;
					}
				}
			</style>
			<div class="sp">
				<svg viewBox="-12 -12 56 56">
					<defs>
						<clipPath id="sp-clip"><rect width="32" height="32" rx="9" /></clipPath>
						<radialGradient id="sp-glow">
							<stop offset="0.35" stop-color="currentColor" />
							<stop offset="1" stop-color="currentColor" stop-opacity="0" />
						</radialGradient>
						<linearGradient id="sp-shine" x1="0" x2="1" y1="0" y2="0">
							<stop offset="0" stop-color="#fff" stop-opacity="0" />
							<stop offset="0.5" stop-color="#fff" stop-opacity="0.42" />
							<stop offset="1" stop-color="#fff" stop-opacity="0" />
						</linearGradient>
					</defs>
					<circle class="glow" cx="16" cy="16" r="27" />
					<circle class="ring" cx="16" cy="16" r="16" />
					<circle class="ring ring2" cx="16" cy="16" r="16" />
					<g class="t">
						<rect class="bg" width="32" height="32" rx="9" />
						<g clip-path="url(#sp-clip)">
							<rect class="shine" x="-16" y="-8" width="10" height="48" />
						</g>
						<path class="l l1" d="M9 11.5 16 8l7 3.5-7 3.5-7-3.5Z" />
						<path class="l l2" d="M9 16l7 3.5 7-3.5" />
						<path class="l l3" d="M9 20.5 16 24l7-3.5" />
					</g>
				</svg>
				<span class="word">groupbase</span>
				<span class="hint">Открываем сайт группы…</span>
			</div>
		</div>
		<div class="app-root">%sveltekit.body%</div>
	</body>
</html>
