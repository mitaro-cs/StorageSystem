<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="robots" content="noindex, nofollow" />
		<meta name="referrer" content="no-referrer" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f1f2f4" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
		<!-- ?v=3 — иконки кешируются на месяц (и в браузере, и старыми service worker), новый адрес
		     загружает их заново. Выбранный значок (lib/theme.ts ICONS) ставит скрипт ниже. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg?v=3" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-180.png?v=3" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/inter-cyrillic-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<script>
			try {
				var t = localStorage.getItem('gb-theme');
				if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
				// Цветовая тема — до первой отрисовки, чтобы страница не мигнула «Классикой».
				var p = localStorage.getItem('gb-palette');
				if (/^(graphite|ocean|forest|sunset|grape)$/.test(p || ''))
					document.documentElement.setAttribute('data-palette', p);
				// Стиль карточек и фона (Профиль → Оформление): «Обычный» — без атрибута.
				var st = localStorage.getItem('gb-style');
				if (/^(depth|glass|tint|outline|neon|paper|comic)$/.test(st || ''))
					document.documentElement.setAttribute('data-style', st);
				// Фон страниц: узор или своя картинка (Профиль → Оформление → Фон).
				var bg = localStorage.getItem('gb-bg');
				var img = bg === 'custom' && localStorage.getItem('gb-bg-image');
				if (/^(aurora|sunset|ocean|mint|grid|dots|lines)$/.test(bg || '') || img) {
					document.documentElement.setAttribute('data-bg', bg);
					if (img) document.documentElement.style.setProperty('--bg-image', 'url("' + img + '")');
				}
				// Значок во вкладке и для установки на экран «Домой».
				var ic = localStorage.getItem('gb-icon');
				if (/^(dark|ocean|forest|sunset|grape)$/.test(ic || '')) {
					var set = function (rel, href) {
						var l = document.querySelector('link[rel="' + rel + '"]');
						if (l) l.setAttribute('href', href);
					};
					set('icon', '/icons/v/' + ic + '.svg?v=3');
					set('apple-touch-icon', '/icons/v/' + ic + '-180.png?v=3');
					set('manifest', '/manifest-' + ic + '.webmanifest');
				}
			} catch (e) {}
			// Данные первого экрана — сразу, пока грузится код интерфейса: через туннель каждый
			// запрос — задержка, а так они идут параллельно (lib/early.ts забирает ответы).
			try {
				var path = location.pathname;
				var app =
					/^\/(?:$|(?:homework|install|link|materials|members|news|notifications|profile|search|session|settings|subjects)(?:\/|$))/;
				if (window.fetch && app.test(path)) {
					var req = {};
					var ask = function (u) {
						var r = fetch(u, {
							credentials: 'same-origin',
							headers: { Accept: 'application/json' }
						});
						r.catch(function () {});
						req[u] = r;
					};
					ask('/api/me');
					ask('/api/subjects');
					var today = localStorage.getItem('gb-today');
					if (path === '/' && /^\/api\/today(\?group=\d+)?$/.test(today || '')) ask(today);
					window.__gbEarly = { at: Date.now(), req: req };
				}
			} catch (e) {}
		</script>
		<title>groupbase</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Заставка, пока грузится приложение: плитка логотипа выпрыгивает, Атлант поднимается, глобус
		     падает ему на руки и пружинит, потом вращается и покачивается; по глобусу пробегает блик,
		     Атлант моргает, от плитки расходятся круги. Убирает её корневой макет
		     (routes/+layout.svelte), когда интерфейс готов. -->
		<div id="splash" aria-hidden="true">
			<style>
				/* Уход заставки: из середины раскрывается круг, в нём проявляется приложение, а плитка
				   логотипа приближается и тает. Без @property (старые браузеры) — просто растворяется. */
				@property --hole {
					syntax: '<length>';
					inherits: false;
					initial-value: 0px;
				}
				#splash {
					--sp-bg: #f1f2f4;
					--sp-fg: #0d0d0f;
					--sp-glow: 0.12;
					position: fixed;
					inset: 0;
					z-index: 9999;
					display: grid;
					place-items: center;
					background: var(--sp-bg);
					color: var(--sp-fg);
					-webkit-mask: radial-gradient(
						circle at 50% 46%,
						transparent var(--hole),
						#000 calc(var(--hole) + 1px)
					);
					mask: radial-gradient(
						circle at 50% 46%,
						transparent var(--hole),
						#000 calc(var(--hole) + 1px)
					);
					transition:
						--hole 680ms cubic-bezier(0.65, 0, 0.25, 1),
						opacity 420ms ease 260ms,
						visibility 0s 700ms;
				}
				:root[data-theme='dark'] #splash {
					--sp-bg: #000;
					--sp-fg: #f5f5f7;
					--sp-glow: 0.22;
				}
				@media (prefers-color-scheme: dark) {
					:root:not([data-theme='light']) #splash {
						--sp-bg: #000;
						--sp-fg: #f5f5f7;
						--sp-glow: 0.22;
					}
				}
				#splash.gone {
					--hole: 150vmax;
					opacity: 0;
					visibility: hidden;
					pointer-events: none;
				}
				#splash .sp {
					display: flex;
					flex-direction: column;
					align-items: center;
					gap: 10px;
					transition:
						transform 560ms cubic-bezier(0.5, 0, 0.2, 1),
						opacity 360ms ease 120ms;
				}
				#splash.gone .sp {
					transform: scale(1.7);
					opacity: 0;
				}
				#splash svg {
					width: 132px;
					height: 132px;
					overflow: visible;
				}
				/* Плитка логотипа — белая, как значок приложения; на светлом фоне — с тонкой каймой. */
				#splash .t {
					transform-box: fill-box;
					transform-origin: center;
					animation:
						sp-pop 520ms cubic-bezier(0.2, 0.9, 0.25, 1.3) both,
						sp-bob 3.2s ease-in-out 0.9s infinite;
				}
				#splash .bg {
					fill: #fff;
					stroke: rgb(0 0 0 / 0.08);
					stroke-width: 0.3;
				}
				:root[data-theme='dark'] #splash .bg {
					stroke: none;
				}
				@media (prefers-color-scheme: dark) {
					:root:not([data-theme='light']) #splash .bg {
						stroke: none;
					}
				}
				/* Глобус: параллели на месте, меридианы (скрипт ниже) плывут — он вращается. */
				#splash .ball {
					fill: #1b0102;
					transition: fill 400ms ease;
				}
				/* Глобус падает на руки и пружинит, потом Атлант его покачивает. */
				#splash .globe {
					transform-box: fill-box;
					transform-origin: 18% 92%;
					animation:
						sp-land 620ms cubic-bezier(0.3, 1, 0.4, 1) 260ms both,
						sp-lift 3.2s ease-in-out 1.1s infinite;
				}
				#splash .gloss {
					fill: url(#sp-gloss);
					animation: sp-gloss 3.4s cubic-bezier(0.4, 0, 0.2, 1) 1.3s infinite;
				}
				#splash .grid {
					fill: none;
					stroke: #fff;
					stroke-width: 1.45;
				}
				#splash .mer {
					transition: opacity 500ms ease;
				}
				#splash.spinning .mer {
					opacity: 0;
				}
				#splash .fig {
					fill: #1b0102;
					stroke: #fff;
					stroke-width: 3;
					paint-order: stroke;
					animation: sp-rise 480ms cubic-bezier(0.3, 1.5, 0.5, 1) 170ms both;
				}
				#splash .eye {
					fill: #fff;
					transform-box: fill-box;
					transform-origin: center;
					animation:
						sp-rise 480ms cubic-bezier(0.3, 1.5, 0.5, 1) 170ms both,
						sp-blink 4.6s ease-in-out 1.8s infinite;
				}
				@keyframes sp-land {
					0% {
						opacity: 0;
						transform: translateY(-260px);
					}
					45% {
						opacity: 1;
						transform: translateY(10px) scale(1.05, 0.93);
					}
					62% {
						transform: translateY(-24px);
					}
					80% {
						transform: translateY(4px) scale(1.01, 0.99);
					}
					100% {
						transform: none;
					}
				}
				@keyframes sp-lift {
					0%,
					100% {
						transform: none;
					}
					50% {
						transform: translateY(-10px);
					}
				}
				@keyframes sp-rise {
					from {
						opacity: 0;
						transform: translateY(90px);
					}
					to {
						opacity: 1;
						transform: none;
					}
				}
				@keyframes sp-blink {
					0%,
					90%,
					100% {
						transform: none;
					}
					94% {
						transform: scaleY(0.12);
					}
				}
				@keyframes sp-gloss {
					from {
						transform: translateX(-420px) skewX(-18deg);
					}
					45%,
					to {
						transform: translateX(420px) skewX(-18deg);
					}
				}
				#splash .ring {
					fill: none;
					stroke: currentColor;
					stroke-width: 0.6;
					opacity: 0;
					transform-box: fill-box;
					transform-origin: center;
					animation: sp-ring 2.6s cubic-bezier(0.2, 0.6, 0.3, 1) 600ms infinite;
				}
				#splash .ring2 {
					animation-delay: 2.2s;
				}
				#splash .glow {
					fill: url(#sp-glow);
					opacity: 0;
					transform-box: fill-box;
					transform-origin: center;
					animation: sp-glow 3.2s ease-in-out 450ms infinite;
				}
				#splash .word {
					font:
						650 23px/1 -apple-system,
						'Segoe UI',
						Roboto,
						sans-serif;
					letter-spacing: -0.02em;
					animation: sp-word 520ms cubic-bezier(0.2, 0.8, 0.2, 1) 360ms both;
				}
				#splash .hint {
					min-height: 18px;
					margin-top: 6px;
					font:
						500 13px/1.4 -apple-system,
						'Segoe UI',
						Roboto,
						sans-serif;
					opacity: 0;
					animation: sp-hint 700ms ease 2.8s forwards;
				}
				@keyframes sp-pop {
					from {
						opacity: 0;
						transform: scale(0.35) rotate(-18deg);
					}
					55% {
						opacity: 1;
					}
					to {
						transform: none;
					}
				}
				@keyframes sp-bob {
					0%,
					100% {
						transform: translateY(0);
					}
					50% {
						transform: translateY(-1.2px);
					}
				}
				@keyframes sp-ring {
					from {
						opacity: 0.32;
						transform: scale(1);
					}
					to {
						opacity: 0;
						transform: scale(1.7);
					}
				}
				@keyframes sp-word {
					from {
						opacity: 0;
						letter-spacing: 0.32em;
						filter: blur(6px);
					}
					to {
						opacity: 1;
						letter-spacing: -0.02em;
						filter: none;
					}
				}
				@keyframes sp-glow {
					0%,
					100% {
						opacity: calc(var(--sp-glow) * 0.45);
						transform: scale(0.9);
					}
					50% {
						opacity: var(--sp-glow);
						transform: scale(1.05);
					}
				}
				@keyframes sp-hint {
					to {
						opacity: 0.5;
					}
				}
				/* Не открылось: ниже логотипа — причина, код и что делать. */
				#splash .badge {
					display: none;
					transform-box: fill-box;
					transform-origin: center;
				}
				#splash .badge circle {
					fill: #d93a2f;
					stroke: var(--sp-bg);
					stroke-width: 1.6;
				}
				#splash .badge path {
					fill: none;
					stroke: #fff;
					stroke-width: 1.8;
					stroke-linecap: round;
				}
				#splash .err {
					display: none;
					flex-direction: column;
					align-items: center;
					gap: 10px;
					max-width: 360px;
					padding: 0 20px;
					text-align: center;
					font:
						15px/1.45 -apple-system,
						'Segoe UI',
						Roboto,
						sans-serif;
					animation: sp-in 420ms ease both;
				}
				@keyframes sp-in {
					from {
						opacity: 0;
						transform: translateY(8px);
					}
				}
				#splash .err b {
					font-size: 19px;
					letter-spacing: -0.01em;
				}
				#splash .err .why {
					color: #d93a2f;
					font-weight: 600;
				}
				#splash .err .what {
					opacity: 0.65;
					font-size: 14px;
				}
				#splash .err button {
					height: 42px;
					padding: 0 18px;
					border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
					border-radius: 999px;
					background: transparent;
					color: inherit;
					font-family: inherit;
					font-size: 15px;
					font-weight: 600;
					line-height: 1;
					cursor: pointer;
				}
				#splash .err .go {
					border-color: currentColor;
					background: currentColor;
				}
				#splash .err .go span {
					color: var(--sp-bg);
				}
				#splash .err .code {
					height: 30px;
					padding: 0 12px;
					font:
						600 13px/1 ui-monospace,
						'SF Mono',
						Menlo,
						Consolas,
						monospace;
					opacity: 0.8;
				}
				#splash .err .row {
					display: flex;
					flex-wrap: wrap;
					justify-content: center;
					gap: 8px;
					margin-top: 6px;
				}
				#splash.failed .err {
					display: flex;
				}
				#splash.failed .word,
				#splash.failed .hint,
				#splash.failed .ring,
				#splash.failed .glow {
					display: none;
				}
				#splash.failed .t {
					animation: none;
				}
				/* Не открылось: глобус краснеет и соскальзывает с плеч, в углу «!». */
				#splash.failed .ball {
					fill: #d93a2f;
				}
				#splash.failed .globe {
					animation: sp-fall 800ms cubic-bezier(0.3, 1.3, 0.5, 1) forwards;
				}
				#splash.failed .gloss {
					display: none;
				}
				#splash.failed .eye {
					animation: none;
				}
				@keyframes sp-fall {
					to {
						transform: translate(-26px, 30px) rotate(-24deg);
					}
				}
				#splash.failed .spin {
					display: none;
				}
				#splash.failed .mer {
					opacity: 1;
				}
				#splash.failed .badge {
					display: inline;
					animation: sp-pop 520ms cubic-bezier(0.2, 0.9, 0.25, 1.4) 250ms both;
				}
				@media (prefers-reduced-motion: reduce) {
					#splash *,
					#splash .sp {
						animation: none !important;
						transition: none !important;
					}
					#splash .ring,
					#splash .glow,
					#splash .gloss,
					#splash .hint {
						display: none;
					}
				}
			</style>
			<div class="sp">
				<svg viewBox="-12 -12 56 56">
					<defs>
						<clipPath id="sp-clip"><circle cx="347.8" cy="273.1" r="165" /></clipPath>
						<radialGradient id="sp-glow">
							<stop offset="0.35" stop-color="currentColor" />
							<stop offset="1" stop-color="currentColor" stop-opacity="0" />
						</radialGradient>
						<linearGradient id="sp-gloss" x1="0" x2="1" y1="0" y2="0">
							<stop offset="0" stop-color="#fff" stop-opacity="0" />

							<stop offset="1" stop-color="#fff" stop-opacity="0" />
						</linearGradient>
					</defs>
					<circle class="glow" cx="16" cy="16" r="27" />
					<circle class="ring" cx="16" cy="16" r="16" />
					<circle class="ring ring2" cx="16" cy="16" r="16" />
					<g class="t">
						<rect class="bg" width="32" height="32" rx="9" />
						<!-- Логотип из static/logo.svg (координаты 736 × 736, уменьшен до плитки 32). -->
						<g transform="scale(0.0434783)">
							<g class="globe">
								<circle class="ball" cx="347.8" cy="273.1" r="165" />

									<path d="M181.8 190.3H513.8M181.8 273.2H513.8M181.8 356H513.8" />
									<path

									/>
								</g>
								<!-- Блик: пробегает по глобусу. -->
								<g clip-path="url(#sp-clip)">
									<rect class="gloss" x="130" y="80" width="90" height="400" />
								</g>
							</g>

					<span class="why"></span>
					<span class="what"></span>
					<button class="code" type="button" title="Скопировать код"></button>
					<div class="row">

		<script>
			// Сторож заставки: если интерфейс так и не открылся, объясняем почему — с кодом ошибки.
			// Коды — в docs/desktop.md («Коды ошибок»).
			(function () {
				var splash = document.getElementById('splash');
				var problems = [];
				addEventListener(
					'error',
					function (e) {
						var t = e.target;
						var src = t && t !== window && (t.src || t.href);
						problems.push(
							src
								? 'не загрузились файлы интерфейса (' + String(src).split('/').pop() + ')'
								: e.message
						);
					},
					true
				);
				addEventListener('unhandledrejection', function (e) {
					var r = e.reason;
					problems.push((r && (r.message || r.name)) || 'ошибка запуска');
				});
				function alive() {
					return document.getElementById('splash') && !splash.classList.contains('gone');
				}
				function q(sel) {
					return splash.querySelector(sel);
				}
				function fail(code, why, what) {
					if (!alive() || splash.classList.contains('failed')) return;
					q('.why').textContent = why;
					q('.what').textContent = what;
					q('.code').textContent = 'Код ошибки ' + code;
					q('.code').setAttribute('data-code', code);
					splash.setAttribute('aria-hidden', 'false');
					splash.classList.add('failed');
				}
				var later =
					'Если вы уже заходили раньше, откройте groupbase ещё раз — покажутся сохранённые данные.';
				function check(last) {
					if (!alive()) return;
					if (!navigator.onLine)
						return fail(
							'GB-101',
							'Нет подключения к интернету.',
							'Проверьте Wi‑Fi или мобильную сеть и нажмите «Попробовать снова».'
						);
					var ctl = window.AbortController ? new AbortController() : null;
					var timer = setTimeout(function () {
						if (ctl) ctl.abort();
					}, 7000);
					fetch('/api/health', { cache: 'no-store', signal: ctl && ctl.signal }).then(
						function (r) {
							clearTimeout(timer);
							if (!r.headers.get('X-Groupbase'))
								return fail(
									'GB-103',
									'Вместо сайта группы ответил другой сервер.',
									'Скорее всего, компьютер старосты выключен или доступ закрыт. ' + later
								);
							if (!r.ok)
								return fail(
									'GB-104',
									'Сервер группы ответил ошибкой ' + r.status + '.',
									'Попробуйте через минуту. Если повторяется — сообщите старосте код ошибки.'
								);
							if (problems.length)
								return fail(
									'GB-106',
									'Интерфейс не запустился: ' + problems[0] + '.',
									'Нажмите «Сбросить кэш и открыть». Если не поможет — обновите браузер.'
								);
							if (last)
								return fail(
									'GB-105',
									'Сервер работает, но интерфейс не загрузился.',
									'Обычно помогает «Сбросить кэш и открыть».'
								);
							// Сервер на месте, просто связь медленная — подождём ещё.
							q('.hint').textContent = 'Связь медленная — ещё немного…';
							setTimeout(function () {
								check(true);
							}, 15000);
						},
						function () {
							clearTimeout(timer);
							fail(
								'GB-102',
								'Сервер группы не отвечает.',
								'Возможно, компьютер старосты выключен или нет связи. ' + later
							);
						}
					);
				}
				setTimeout(function () {
					check(false);
				}, 8000);
				splash.addEventListener('click', function (e) {
					var b = e.target.closest && e.target.closest('button');
					if (!b) return;
					if (b.classList.contains('code')) {
						var code = b.getAttribute('data-code');
						if (navigator.clipboard)
							navigator.clipboard.writeText(code).then(function () {
								b.textContent = 'Скопировано';
								setTimeout(function () {
									b.textContent = 'Код ошибки ' + code;
								}, 1400);
							});
						return;
					}
					if (b.getAttribute('data-act') === 'retry') return location.reload();
					// Сброс: service worker и его кеш. Копию данных не трогаем — в ней могут быть
					// ещё не отправленные действия.
					var jobs = [];
					if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
						jobs.push(
							navigator.serviceWorker.getRegistrations().then(function (list) {
								return Promise.all(
									list.map(function (r) {
										return r.unregister();
									})
								);
							})
						);
					if (window.caches)
						jobs.push(
							caches.keys().then(function (keys) {
								return Promise.all(
									keys.map(function (k) {
										return caches.delete(k);
									})
								);
							})
						);
					Promise.all(jobs).then(
						function () {
							location.reload();
						},
						function () {
							location.reload();
						}
					);
				});
			})();
			// Вращение глобуса: меридианы через 30° плывут слева направо и гаснут у краёв. Пока скрипт
			// не запустился (или движение отключено в системе) — неподвижная сетка, как на логотипе.
			(function () {
				var splash = document.getElementById('splash');
				var still = splash && splash.querySelector('.mer');
				if (
					!still ||
					!window.requestAnimationFrame ||
					(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)
				)
					return;
				var ball = splash.querySelector('.ball');
				var cx = +ball.getAttribute('cx');
				var cy = +ball.getAttribute('cy');
				var r = +ball.getAttribute('r');
				var lines = [];
				for (var i = 0; i < 6; i++) {
					var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
					p.setAttribute('class', 'spin');
					still.parentNode.appendChild(p);
					lines.push(p);
				}
				var start = 0;
				function frame(now) {
					if (!splash.isConnected || /\b(gone|failed)\b/.test(splash.className)) return;
					if (!start) start = now;
					var t = (now - start) / 1000;
					// Меридианы проявляются за полсекунды: в начале они совпадают с сеткой логотипа.
					var appear = Math.min(1, t / 0.5);
					for (var k = 0; k < 6; k++) {
						var lon = ((k * 30 + t * 24 + 90) % 180) - 90;
						var s = Math.sin((lon * Math.PI) / 180);
						lines[k].setAttribute(
							'd',
							'M' +
								cx +
								' ' +
								(cy - r) +
								'A' +
								Math.abs(r * s).toFixed(2) +
								' ' +
								r +
								' 0 0 ' +
								(s > 0 ? 1 : 0) +
								' ' +
								cx +
								' ' +
								(cy + r)
						);
						var edge = Math.max(0, Math.min(1, (75 - Math.abs(lon)) / 25));
						lines[k].style.opacity = String(Math.abs(lon) <= 30 ? 1 : edge * appear);
					}
					requestAnimationFrame(frame);
				}
				// Сначала глобус падает на руки с неподвижной сеткой, затем начинает вращаться.
				setTimeout(function () {
					if (!splash.isConnected) return;
					splash.classList.add('spinning');
					requestAnimationFrame(frame);
				}, 1400);
			})();
		</script>
