<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="robots" content="noindex, nofollow" />
		<meta name="referrer" content="no-referrer" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f1f2f4" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-180.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/inter-cyrillic-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<script>
			try {
				var t = localStorage.getItem('gb-theme');
				if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
				// Цветовая тема — до первой отрисовки, чтобы страница не мигнула «Классикой».
				var p = localStorage.getItem('gb-palette');
				if (/^(graphite|ocean|forest|sunset|grape)$/.test(p || ''))
					document.documentElement.setAttribute('data-palette', p);
			} catch (e) {}
		</script>
		<title>groupbase</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Заставка, пока грузится приложение: плитка логотипа появляется, слои складываются в стопку
		     и «дышат», по плитке пробегает блик, от неё расходятся круги. Убирает её корневой макет
		     (routes/+layout.svelte), когда интерфейс готов. -->
		<div id="splash" aria-hidden="true">
			<style>
				#splash {
					--sp-bg: #f1f2f4;
					--sp-fg: #0d0d0f;
					--sp-glow: 0.12;
					position: fixed;
					inset: 0;
					z-index: 9999;
					display: grid;
					place-items: center;
					background: var(--sp-bg);
					color: var(--sp-fg);
					transition:
						opacity 380ms ease,
						visibility 0s 380ms;
				}
				:root[data-theme='dark'] #splash {
					--sp-bg: #000;
					--sp-fg: #f5f5f7;
					--sp-glow: 0.22;
				}
				@media (prefers-color-scheme: dark) {
					:root:not([data-theme='light']) #splash {
						--sp-bg: #000;
						--sp-fg: #f5f5f7;
						--sp-glow: 0.22;
					}
				}
				#splash.gone {
					opacity: 0;
					visibility: hidden;
					pointer-events: none;
				}
				#splash .sp {
					display: flex;
					flex-direction: column;
					align-items: center;
					gap: 10px;
					transition: transform 380ms cubic-bezier(0.2, 0.8, 0.2, 1);
				}
				#splash.gone .sp {
					transform: scale(1.08);
				}
				#splash svg {
					width: 132px;
					height: 132px;
					overflow: visible;
				}
				#splash .t {
					transform-box: fill-box;
					transform-origin: center;
					animation:
						sp-pop 760ms cubic-bezier(0.2, 0.9, 0.25, 1.3) both,
						sp-bob 3.2s ease-in-out 1.2s infinite;
				}
				#splash .bg {
					fill: currentColor;
				}
				#splash .l {
					fill: none;
					stroke: var(--sp-bg);
					stroke-width: 2.2;
					stroke-linecap: round;
					stroke-linejoin: round;
					transform-box: view-box;
				}
				#splash .l1 {
					--lift: -1.6px;
					animation:
						sp-drop 640ms cubic-bezier(0.3, 1.5, 0.5, 1) 380ms both,
						sp-float 2.4s ease-in-out 1.3s infinite;
				}
				#splash .l2 {
					--lift: -1px;
					animation:
						sp-drop 640ms cubic-bezier(0.3, 1.5, 0.5, 1) 500ms both,
						sp-float 2.4s ease-in-out 1.45s infinite;
				}
				#splash .l3 {
					--lift: -0.5px;
					animation:
						sp-drop 640ms cubic-bezier(0.3, 1.5, 0.5, 1) 620ms both,
						sp-float 2.4s ease-in-out 1.6s infinite;
				}
				#splash .shine {
					fill: url(#sp-shine);
					animation: sp-shine 3s cubic-bezier(0.4, 0, 0.2, 1) 1.1s infinite;
				}
				#splash .ring {
					fill: none;
					stroke: currentColor;
					stroke-width: 0.6;
					opacity: 0;
					transform-box: fill-box;
					transform-origin: center;
					animation: sp-ring 2.6s cubic-bezier(0.2, 0.6, 0.3, 1) 900ms infinite;
				}
				#splash .ring2 {
					animation-delay: 2.2s;
				}
				#splash .glow {
					fill: url(#sp-glow);
					opacity: 0;
					transform-box: fill-box;
					transform-origin: center;
					animation: sp-glow 3.2s ease-in-out 700ms infinite;
				}
				#splash .word {
					font:
						650 23px/1 -apple-system,
						'Segoe UI',
						Roboto,
						sans-serif;
					letter-spacing: -0.02em;
					animation: sp-word 760ms cubic-bezier(0.2, 0.8, 0.2, 1) 560ms both;
				}
				#splash .hint {
					min-height: 18px;
					margin-top: 6px;
					font:
						500 13px/1.4 -apple-system,
						'Segoe UI',
						Roboto,
						sans-serif;
					opacity: 0;
					animation: sp-hint 700ms ease 2.8s forwards;
				}
				:root[data-theme='dark'] #splash .shine {
					display: none;
				}
				@media (prefers-color-scheme: dark) {
					:root:not([data-theme='light']) #splash .shine {
						display: none;
					}
				}
				@keyframes sp-pop {
					from {
						opacity: 0;
						transform: scale(0.35) rotate(-18deg);
					}
					55% {
						opacity: 1;
					}
					to {
						transform: none;
					}
				}
				@keyframes sp-bob {
					0%,
					100% {
						transform: translateY(0);
					}
					50% {
						transform: translateY(-1.2px);
					}
				}
				@keyframes sp-drop {
					from {
						opacity: 0;
						transform: translateY(-8px);
					}
					to {
						opacity: 1;
						transform: none;
					}
				}
				@keyframes sp-float {
					0%,
					100% {
						transform: none;
					}
					50% {
						transform: translateY(var(--lift));
					}
				}
				@keyframes sp-shine {
					from {
						transform: translateX(0) skewX(-20deg);
					}
					45%,
					to {
						transform: translateX(58px) skewX(-20deg);
					}
				}
				@keyframes sp-ring {
					from {
						opacity: 0.32;
						transform: scale(1);
					}
					to {
						opacity: 0;
						transform: scale(1.7);
					}
				}
				@keyframes sp-word {
					from {
						opacity: 0;
						letter-spacing: 0.32em;
						filter: blur(6px);
					}
					to {
						opacity: 1;
						letter-spacing: -0.02em;
						filter: none;
					}
				}
				@keyframes sp-glow {
					0%,
					100% {
						opacity: calc(var(--sp-glow) * 0.45);
						transform: scale(0.9);
					}
					50% {
						opacity: var(--sp-glow);
						transform: scale(1.05);
					}
				}
				@keyframes sp-hint {
					to {
						opacity: 0.5;
					}
				}
				/* Не открылось: стопка рассыпается и краснеет, в углу «!», ниже — причина, код и что делать. */
				#splash .badge {
					display: none;
					transform-box: fill-box;
					transform-origin: center;
				}
				#splash .badge circle {
					fill: #d93a2f;
					stroke: var(--sp-bg);
					stroke-width: 1.6;
				}
				#splash .badge path {
					fill: none;
					stroke: #fff;
					stroke-width: 1.8;
					stroke-linecap: round;
				}
				#splash .err {
					display: none;
					flex-direction: column;
					align-items: center;
					gap: 10px;
					max-width: 360px;
					padding: 0 20px;
					text-align: center;
					font:
						15px/1.45 -apple-system,
						'Segoe UI',
						Roboto,
						sans-serif;
					animation: sp-in 420ms ease both;
				}
				@keyframes sp-in {
					from {
						opacity: 0;
						transform: translateY(8px);
					}
				}
				#splash .err b {
					font-size: 19px;
					letter-spacing: -0.01em;
				}
				#splash .err .why {
					color: #d93a2f;
					font-weight: 600;
				}
				#splash .err .what {
					opacity: 0.65;
					font-size: 14px;
				}
				#splash .err button {
					height: 42px;
					padding: 0 18px;
					border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
					border-radius: 999px;
					background: transparent;
					color: inherit;
					font-family: inherit;
					font-size: 15px;
					font-weight: 600;
					line-height: 1;
					cursor: pointer;
				}
				#splash .err .go {
					border-color: currentColor;
					background: currentColor;
				}
				#splash .err .go span {
					color: var(--sp-bg);
				}
				#splash .err .code {
					height: 30px;
					padding: 0 12px;
					font:
						600 13px/1 ui-monospace,
						'SF Mono',
						Menlo,
						Consolas,
						monospace;
					opacity: 0.8;
				}
				#splash .err .row {
					display: flex;
					flex-wrap: wrap;
					justify-content: center;
					gap: 8px;
					margin-top: 6px;
				}
				#splash.failed .err {
					display: flex;
				}
				#splash.failed .word,
				#splash.failed .hint,
				#splash.failed .ring,
				#splash.failed .glow,
				#splash.failed .shine {
					display: none;
				}
				#splash.failed .t {
					animation: none;
				}
				#splash.failed .bg {
					fill: #d93a2f;
				}
				#splash.failed .l1 {
					animation: sp-s1 700ms cubic-bezier(0.3, 1.4, 0.5, 1) forwards;
				}
				#splash.failed .l2 {
					animation: sp-s2 700ms cubic-bezier(0.3, 1.4, 0.5, 1) 60ms forwards;
				}
				#splash.failed .l3 {
					animation: sp-s3 700ms cubic-bezier(0.3, 1.4, 0.5, 1) 120ms forwards;
				}
				#splash.failed .l {
					stroke: #fff;
				}
				#splash.failed .badge {
					display: inline;
					animation: sp-pop 520ms cubic-bezier(0.2, 0.9, 0.25, 1.4) 250ms both;
				}
				@keyframes sp-s1 {
					to {
						transform: translate(-2.5px, -2.5px) rotate(-14deg);
					}
				}
				@keyframes sp-s2 {
					to {
						transform: translate(2.5px, 0.5px) rotate(9deg);
					}
				}
				@keyframes sp-s3 {
					to {
						transform: translate(-1px, 2.5px) rotate(-5deg);
					}
				}
				@media (prefers-reduced-motion: reduce) {
					#splash *,
					#splash .sp {
						animation: none !important;
						transition: none !important;
					}
					#splash .ring,
					#splash .glow,
					#splash .shine,
					#splash .hint {
						display: none;
					}
				}
			</style>
			<div class="sp">
				<svg viewBox="-12 -12 56 56">
					<defs>
						<clipPath id="sp-clip"><rect width="32" height="32" rx="9" /></clipPath>
						<radialGradient id="sp-glow">
							<stop offset="0.35" stop-color="currentColor" />
							<stop offset="1" stop-color="currentColor" stop-opacity="0" />
						</radialGradient>
						<linearGradient id="sp-shine" x1="0" x2="1" y1="0" y2="0">
							<stop offset="0" stop-color="#fff" stop-opacity="0" />
							<stop offset="0.5" stop-color="#fff" stop-opacity="0.42" />
							<stop offset="1" stop-color="#fff" stop-opacity="0" />
						</linearGradient>
					</defs>
					<circle class="glow" cx="16" cy="16" r="27" />
					<circle class="ring" cx="16" cy="16" r="16" />
					<circle class="ring ring2" cx="16" cy="16" r="16" />
					<g class="t">
						<rect class="bg" width="32" height="32" rx="9" />
						<g clip-path="url(#sp-clip)">
							<rect class="shine" x="-16" y="-8" width="10" height="48" />
						</g>
						<path class="l l1" d="M9 11.5 16 8l7 3.5-7 3.5-7-3.5Z" />
						<path class="l l2" d="M9 16l7 3.5 7-3.5" />
						<path class="l l3" d="M9 20.5 16 24l7-3.5" />
					</g>
					<g class="badge">
						<circle cx="30" cy="2" r="6" />
						<path d="M30-.8v3.4M30 5.2v.1" />
					</g>
				</svg>
				<span class="word">groupbase</span>
				<span class="hint">Открываем сайт группы…</span>
				<div class="err" role="alert">
					<b>Не получается открыть groupbase</b>
					<span class="why"></span>
					<span class="what"></span>
					<button class="code" type="button" title="Скопировать код"></button>
					<div class="row">
						<button class="go" type="button" data-act="retry">
							<span>Попробовать снова</span>
						</button>
						<button type="button" data-act="reset">Сбросить кэш и открыть</button>
					</div>
				</div>
			</div>
		</div>
		<script>
			// Сторож заставки: если интерфейс так и не открылся, объясняем почему — с кодом ошибки.
			// Коды — в docs/desktop.md («Коды ошибок»).
			(function () {
				var splash = document.getElementById('splash');
				var problems = [];
				addEventListener(
					'error',
					function (e) {
						var t = e.target;
						var src = t && t !== window && (t.src || t.href);
						problems.push(
							src
								? 'не загрузились файлы интерфейса (' + String(src).split('/').pop() + ')'
								: e.message
						);
					},
					true
				);
				addEventListener('unhandledrejection', function (e) {
					var r = e.reason;
					problems.push((r && (r.message || r.name)) || 'ошибка запуска');
				});
				function alive() {
					return document.getElementById('splash') && !splash.classList.contains('gone');
				}
				function q(sel) {
					return splash.querySelector(sel);
				}
				function fail(code, why, what) {
					if (!alive() || splash.classList.contains('failed')) return;
					q('.why').textContent = why;
					q('.what').textContent = what;
					q('.code').textContent = 'Код ошибки ' + code;
					q('.code').setAttribute('data-code', code);
					splash.setAttribute('aria-hidden', 'false');
					splash.classList.add('failed');
				}
				var later =
					'Если вы уже заходили раньше, откройте groupbase ещё раз — покажутся сохранённые данные.';
				function check(last) {
					if (!alive()) return;
					if (!navigator.onLine)
						return fail(
							'GB-101',
							'Нет подключения к интернету.',
							'Проверьте Wi‑Fi или мобильную сеть и нажмите «Попробовать снова».'
						);
					var ctl = window.AbortController ? new AbortController() : null;
					var timer = setTimeout(function () {
						if (ctl) ctl.abort();
					}, 7000);
					fetch('/api/health', { cache: 'no-store', signal: ctl && ctl.signal }).then(
						function (r) {
							clearTimeout(timer);
							if (!r.headers.get('X-Groupbase'))
								return fail(
									'GB-103',
									'Вместо сайта группы ответил другой сервер.',
									'Скорее всего, компьютер старосты выключен или доступ закрыт. ' + later
								);
							if (!r.ok)
								return fail(
									'GB-104',
									'Сервер группы ответил ошибкой ' + r.status + '.',
									'Попробуйте через минуту. Если повторяется — сообщите старосте код ошибки.'
								);
							if (problems.length)
								return fail(
									'GB-106',
									'Интерфейс не запустился: ' + problems[0] + '.',
									'Нажмите «Сбросить кэш и открыть». Если не поможет — обновите браузер.'
								);
							if (last)
								return fail(
									'GB-105',
									'Сервер работает, но интерфейс не загрузился.',
									'Обычно помогает «Сбросить кэш и открыть».'
								);
							// Сервер на месте, просто связь медленная — подождём ещё.
							q('.hint').textContent = 'Связь медленная — ещё немного…';
							setTimeout(function () {
								check(true);
							}, 15000);
						},
						function () {
							clearTimeout(timer);
							fail(
								'GB-102',
								'Сервер группы не отвечает.',
								'Возможно, компьютер старосты выключен или нет связи. ' + later
							);
						}
					);
				}
				setTimeout(function () {
					check(false);
				}, 8000);
				splash.addEventListener('click', function (e) {
					var b = e.target.closest && e.target.closest('button');
					if (!b) return;
					if (b.classList.contains('code')) {
						var code = b.getAttribute('data-code');
						if (navigator.clipboard)
							navigator.clipboard.writeText(code).then(function () {
								b.textContent = 'Скопировано';
								setTimeout(function () {
									b.textContent = 'Код ошибки ' + code;
								}, 1400);
							});
						return;
					}
					if (b.getAttribute('data-act') === 'retry') return location.reload();
					// Сброс: service worker и его кеш. Копию данных не трогаем — в ней могут быть
					// ещё не отправленные действия.
					var jobs = [];
					if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
						jobs.push(
							navigator.serviceWorker.getRegistrations().then(function (list) {
								return Promise.all(
									list.map(function (r) {
										return r.unregister();
									})
								);
							})
						);
					if (window.caches)
						jobs.push(
							caches.keys().then(function (keys) {
								return Promise.all(
									keys.map(function (k) {
										return caches.delete(k);
									})
								);
							})
						);
					Promise.all(jobs).then(
						function () {
							location.reload();
						},
						function () {
							location.reload();
						}
					);
				});
			})();
		</script>
		<div class="app-root">%sveltekit.body%</div>
	</body>
</html>
