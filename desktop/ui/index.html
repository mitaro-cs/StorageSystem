<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>groupbase</title>
		<link rel="stylesheet" href="splash.css" />
		<script src="splash.js" defer></script>
	</head>
	<body>
		<main>
			<!-- Та же «стопка», что у сайта (web/src/app.html): слои складываются и дышат, пока идёт работа. -->
			<svg class="mark" viewBox="-12 -12 56 56" aria-hidden="true">
				<defs>
					<clipPath id="clip"><rect width="32" height="32" rx="9" /></clipPath>
					<radialGradient id="glow">
						<stop offset="0.35" stop-color="currentColor" />
						<stop offset="1" stop-color="currentColor" stop-opacity="0" />
					</radialGradient>
					<linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
						<stop offset="0" stop-color="#fff" stop-opacity="0" />
						<stop offset="0.5" stop-color="#fff" stop-opacity="0.42" />
						<stop offset="1" stop-color="#fff" stop-opacity="0" />
					</linearGradient>
				</defs>
				<circle class="glow" cx="16" cy="16" r="27" />
				<circle class="ring" cx="16" cy="16" r="16" />
				<circle class="ring ring2" cx="16" cy="16" r="16" />
				<g class="tile">
					<rect class="bg" width="32" height="32" rx="9" />
					<g clip-path="url(#clip)"><rect class="shine" x="-16" y="-8" width="10" height="48" /></g>
					<path class="layer l1" d="M9 11.5 16 8l7 3.5-7 3.5-7-3.5Z" />
					<path class="layer l2" d="M9 16l7 3.5 7-3.5" />
					<path class="layer l3" d="M9 20.5 16 24l7-3.5" />
				</g>
				<!-- Значок ошибки: появляется, когда стопка рассыпается. -->
				<g class="badge">
					<circle cx="30" cy="2" r="6" />
					<path d="M30-.8v3.4M30 5.2v.1" />
				</g>
			</svg>
			<h1>groupbase</h1>
			<p id="status" role="status">Запускаем сервер группы…</p>
			<div class="progress" id="progress" hidden><span id="bar"></span></div>
			<button class="code" id="code" type="button" title="Скопировать код" hidden></button>
			<p class="advice" id="advice" hidden></p>
			<details id="more" hidden>
				<summary>Подробности</summary>
				<pre id="details"></pre>
			</details>
			<div class="actions" id="actions" hidden>
				<button id="restart" class="primary">Перезапустить</button>
				<button id="logs">Открыть журналы</button>
			</div>
			<p class="hint">
				Закрытое окно не выключает сайт: groupbase продолжает работать в строке меню (на Windows —
				в трее у часов), чтобы группа могла заходить.
			</p>
		</main>
	</body>
</html>
