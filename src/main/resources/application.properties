# Значения по умолчанию. Переопределяются groupbase.toml и переменными окружения GROUPBASE_*.
spring.application.name=groupbase
spring.main.banner-mode=off
spring.jmx.enabled=false
spring.threads.virtual.enabled=true

server.port=${groupbase.http.port:8080}
server.address=${groupbase.http.address:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.server-header=
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.compression.enabled=true
server.compression.min-response-size=1KB
server.compression.mime-types=application/json,text/html,text/css,text/plain,application/javascript,image/svg+xml,application/manifest+json
server.tomcat.use-relative-redirects=true
server.mime-mappings.webmanifest=application/manifest+json

# Статика отдаётся через StaticWebConfig.
spring.web.resources.add-mappings=false
spring.mvc.problemdetails.enabled=false

# Миграции Flyway встроены в jar.
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

# Логи: JSON без персональных данных в режиме serve (application-serve.properties).
logging.level.root=INFO
logging.level.org.flywaydb=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache.catalina=WARN
